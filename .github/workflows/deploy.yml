name: Deploy preview a GitHub Pages

# Deploy automático en push a main o a la branch del PR.
# Triggerable a mano desde la pestaña Actions con "Run workflow".
on:
  push:
    branches:
      - main
      - feat/web-institucional-quem-central
  workflow_dispatch:

# Permisos requeridos por actions/deploy-pages@v4.
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez. Si llega otra, encola, no cancela.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Astro)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # astro.config.mjs lee PUBLIC_SITE y PUBLIC_BASE. Antes acá se
          # seteaba GITHUB_PAGES, que no lo lee nadie: el build salía con
          # base '/' mientras Pages sirve desde '/pagina-web-ute/', así que
          # todos los assets daban 404. Se derivan del repo para que sigan
          # siendo correctos si se renombra.
          PUBLIC_SITE: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy a GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
